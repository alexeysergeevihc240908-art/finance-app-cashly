<title>Cashly</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --sub:#8E8E93; --sep:rgba(60,60,67,.29);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --purple:#AF52DE;
  --fill:#767680; --barbg:rgba(120,120,128,.16);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#000000;--card:#1C1C1E;--text:#F2F2F7;--sub:#98989D;--sep:rgba(84,84,88,.65);--barbg:rgba(120,120,128,.32);}
}
:root[data-theme="dark"]{--bg:#000000;--card:#1C1C1E;--text:#F2F2F7;--sub:#98989D;--sep:rgba(84,84,88,.65);--barbg:rgba(120,120,128,.32);}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;}
header.top{position:sticky;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(242,242,247,.82);backdrop-filter:blur(20px);z-index:5;border-bottom:.5px solid var(--sep);}
:root:not([data-theme="light"]) header.top{background:rgba(0,0,0,.72);}
header.top h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-0.3px;}
main{flex:1;padding:14px 16px calc(90px + env(safe-area-inset-bottom,0px));}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;background:rgba(242,242,247,.85);backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));}
:root:not([data-theme="light"]) nav.tabbar{background:rgba(20,20,22,.82);}
nav.tabbar button{flex:1;background:none;border:none;font-size:10px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;font-family:inherit;}
nav.tabbar button.active{color:var(--blue);}
nav.tabbar button .ic{font-size:20px;}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:.5px solid var(--sep);gap:10px;}
.row:last-child{border-bottom:none;}
.sub{color:var(--sub);font-size:13px;}
.big{font-size:30px;font-weight:700;letter-spacing:-0.5px;}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;}
.btn{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:600;width:100%;font-family:inherit;}
.btn.secondary{background:var(--barbg);color:var(--blue);}
.btn.small{padding:7px 12px;font-size:13px;width:auto;border-radius:9px;}
.dropzone{border:1.5px dashed var(--sep);border-radius:16px;padding:34px 16px;text-align:center;color:var(--sub);}
select,input[type=text]{background:var(--barbg);border:none;border-radius:8px;padding:6px 8px;color:var(--text);font-family:inherit;font-size:13px;}
.tx-name{font-weight:600;font-size:15px;}
.tx-desc{font-size:12px;color:var(--sub);margin-top:1px;}
.amt{font-weight:600;font-size:15px;white-space:nowrap;}
.amt.pos{color:var(--green);}
.amt.neg{color:var(--text);}
.review{background:rgba(255,149,0,.12);border-radius:10px;padding:8px;margin-top:6px;}
.stepbar{display:flex;gap:6px;margin-bottom:14px;}
.stepbar div{flex:1;height:4px;border-radius:2px;background:var(--barbg);}
.stepbar div.on{background:var(--blue);}
.bar{height:8px;border-radius:4px;background:var(--barbg);overflow:hidden;margin-top:4px;}
.bar > div{height:100%;background:var(--blue);border-radius:4px;}

h2.sec:first-child{margin-top:0;}
.empty{text-align:center;color:var(--sub);padding:40px 20px;}
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1 id="title">Финансы</h1></header>
  <main id="screen"></main>
  <nav class="tabbar">
    <button data-t="home"><span class="ic">🏠</span>Главная</button>
    <button data-t="import"><span class="ic">📥</span>Импорт</button>
    <button data-t="tx"><span class="ic">📋</span>Операции</button>
    <button data-t="analysis"><span class="ic">📊</span>Аналитика</button>
    <button data-t="rules"><span class="ic">⚙️</span>Правила</button>
  </nav>
</div>
<script>
const RUB=n=>(Math.round(n*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽';
const store={
  get(k,d){try{const v=localStorage.getItem('fin_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('fin_'+k,JSON.stringify(v));}catch(e){}}
};
let TX=store.get('tx',[]), RULES=store.get('rules',{}), FPS=new Set(store.get('fps',[]));
let pending=null; // {txs, meta}

const MCC={5411:['Продукты','Еда'],5812:['Рестораны','Еда'],5814:['Фастфуд','Еда'],4121:['Такси','Транспорт'],
5311:['Универмаги','Покупки'],5732:['Электроника','Покупки'],5815:['Цифровые товары','Подписки'],
5912:['Аптеки','Здоровье'],5541:['АЗС','Транспорт'],5999:['Разное','Покупки']};

const MERCHANT_RULES=[
 [/yandex.*eda|яндекс.*еда/i,'Yandex Eda','Еда / Доставка'],
 [/yandex.*go|яндекс.*go/i,'Yandex Go','Транспорт / Такси'],
 [/pyaterochka|пятерочка|пятёрочка/i,'Пятёрочка','Еда / Продукты'],
 [/ozon/i,'Ozon','Покупки / Маркетплейсы'],
 [/wildberries/i,'Wildberries','Покупки / Маркетплейсы'],
 [/netflix/i,'Netflix','Подписки'],
 [/spotify/i,'Spotify','Подписки'],
 [/apple\.com|apple\s?bill/i,'Apple','Подписки / Цифровые услуги'],
 [/magnit|магнит/i,'Магнит','Еда / Продукты'],
 [/lenta|лента/i,'Лента','Еда / Продукты'],
];
const KEYWORD_CAT=[[/такси|taxi/i,'Транспорт / Такси'],[/аптек|pharmacy/i,'Здоровье'],
[/ресторан|кафе|restaurant/i,'Еда / Рестораны'],[/жкх|коммунал/i,'Дом / ЖКХ'],
[/связь|мобильн|tele2|beeline|мтс|megafon/i,'Связь']];

function normMerchant(s){return (s||'').toLowerCase().replace(/[^a-zа-я0-9]+/gi,'_').replace(/^_+|_+$/g,'');}

function cleanAmount(raw){
  if(typeof raw==='number')return raw;
  let s=String(raw).replace(/\u00A0/g,' ').replace(/[₽]|RUR|RUB|руб\.?/gi,'').trim();
  if(/,\d{1,2}$/.test(s) && s.includes('.')) s=s.replace(/\./g,'').replace(',', '.');
  else if(/,\d{1,2}$/.test(s)) s=s.replace(/\s/g,'').replace(',', '.');
  else s=s.replace(/\s/g,'');
  s=s.replace(/[^0-9.\-+]/g,'');
  return parseFloat(s)||0;
}

function findHeader(cell){return (cell||'').toString().replace(/\u00A0/g,' ').trim().toLowerCase();}
const COLMAP={
  date:['дата операции','дата','date'],
  post:['дата проводки','posting date'],
  code:['код','code'],
  bankcat:['категория'],
  desc:['описание','description','назначение платежа'],
  amount:['сумма в валюте счета','сумма операции','сумма','amount'],
  status:['статус','status']
};
function matchCol(header){
  for(const key in COLMAP){for(const kw of COLMAP[key]){if(header.includes(kw))return key;}}
  return null;
}

function extractMerchant(desc){
  desc=desc||'';
  let m=desc.match(/место совершения операции:\s*[A-ZА-Я]{2}\/[^\/]+\/([^,]+),\s*MCC:\s*(\d+)/i);
  if(m){
    let raw=m[1].trim(), mcc=parseInt(m[2]);
    let clean=raw.replace(/[0-9]{2,}/g,'').replace(/\s+/g,' ').trim();
    clean=clean.split(' ').slice(0,2).map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join(' ');
    return {merchant:clean||raw, mcc, transfer:null};
  }
  m=desc.match(/перевод по сбп.*?\s(от|на)\s+(.+)/i);
  if(m){return {merchant:m[2].trim(), mcc:null, transfer:m[1].toLowerCase()==='от'?'in':'out'};}
  let clean=desc.length>40?desc.slice(0,40).trim()+'…':desc;
  return {merchant:clean||'Без названия', mcc:null, transfer:null};
}

function categorize(tx){
  const nm=tx.normalizedMerchant;
  if(RULES[nm]) return {category:RULES[nm],confidence:1.0};
  for(const [re,name,cat] of MERCHANT_RULES){ if(re.test(tx.merchant)||re.test(tx.rawDescription)) return {category:cat,confidence: tx.mcc?0.95:0.9}; }
  if(tx.mcc && MCC[tx.mcc]) return {category:MCC[tx.mcc].join(' / '),confidence:0.75};
  for(const [re,cat] of KEYWORD_CAT){ if(re.test(tx.rawDescription)) return {category:cat,confidence:0.7}; }
  if(tx.bankCategory && tx.bankCategory.length>1) return {category:tx.bankCategory,confidence:0.55};
  return {category:'Другое',confidence:0.3};
}

function fingerprint(tx){return [tx.date,tx.amount,tx.normalizedMerchant,tx.code].join('|');}

async function parseFile(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const sheet=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:true,defval:''});
  let headerIdx=-1, cols={};
  for(let i=0;i<rows.length;i++){
    const found={};
    rows[i].forEach((c,j)=>{const k=matchCol(findHeader(c)); if(k) found[k]=j;});
    if(found.date!==undefined && found.amount!==undefined){headerIdx=i; cols=found; break;}
  }
  if(headerIdx===-1) throw new Error('Не удалось найти таблицу операций в файле.');
  const out=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i]; if(!r||r.every(c=>c==='')) continue;
    const dateRaw=r[cols.date]; if(!dateRaw) continue;
    const amountRaw=r[cols.amount]; if(amountRaw==='' || amountRaw===undefined) continue;
    let date=dateRaw;
    if(typeof date==='number'){ const d=XLSX.SSF.parse_date_code(date); date=`${String(d.d).padStart(2,'0')}.${String(d.m).padStart(2,'0')}.${d.y}`; }
    const amount=cleanAmount(amountRaw);
    if(isNaN(amount)) continue;
    const desc=cols.desc!==undefined?String(r[cols.desc]||''):'';
    const {merchant,mcc,transfer}=extractMerchant(desc);
    const tx={
      id:crypto.randomUUID(), date:String(date).trim(), postDate:cols.post!==undefined?String(r[cols.post]||''):'',
      code:cols.code!==undefined?String(r[cols.code]||''):'', bankCategory:cols.bankcat!==undefined?String(r[cols.bankcat]||''):'',
      rawDescription:desc, amount, status:cols.status!==undefined?String(r[cols.status]||''):'',
      merchant, normalizedMerchant:normMerchant(merchant), mcc
    };
    if(/реверсивный|кэшбэк|cashback/i.test(desc+tx.bankCategory)) tx.type='cashback';
    else if(/комисси/i.test(desc)) tx.type='fee';
    else if(transfer==='in') tx.type='incoming_transfer';
    else if(transfer==='out') tx.type='outgoing_transfer';
    else tx.type=amount>0?'income':'expense';
    const c=categorize(tx);
    tx.category=c.category; tx.confidence=c.confidence;
    tx.needsReview = c.confidence<0.6 || tx.type==='incoming_transfer' || tx.type==='outgoing_transfer';
    tx.fingerprint=fingerprint(tx);
    out.push(tx);
  }
  return out;
}

function detectSubs(txs){
  const byM={};
  txs.forEach(t=>{ if(t.type==='expense'){ (byM[t.normalizedMerchant]=byM[t.normalizedMerchant]||[]).push(t); } });
  const subs=[];
  for(const k in byM){ if(byM[k].length>=2){
    const amts=byM[k].map(t=>Math.abs(t.amount));
    const avg=amts.reduce((a,b)=>a+b,0)/amts.length;
    const stable=amts.every(a=>Math.abs(a-avg)<avg*0.15+1);
    if(stable) subs.push({merchant:byM[k][0].merchant, amount:avg, count:byM[k].length});
  }}
  return subs;
}

// ---------- UI ----------
const screenEl=document.getElementById('screen'), titleEl=document.getElementById('title');
let tab='home';
function setTab(t){tab=t; document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.t===t)); render();}
document.querySelectorAll('nav.tabbar button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

function render(){
  if(tab==='home') return renderHome();
  if(tab==='import') return renderImport();
  if(tab==='tx') return renderTx();
  if(tab==='analysis') return renderAnalysis();
  if(tab==='rules') return renderRules();
}

function renderHome(){
  titleEl.textContent='Финансы';
  const income=TX.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0);
  const expense=TX.filter(t=>t.amount<0).reduce((a,t)=>a+Math.abs(t.amount),0);
  const review=TX.filter(t=>t.needsReview).length;
  screenEl.innerHTML=`
  <div class="card">
    <div class="sub">Баланс операций</div>
    <div class="big">${RUB(income-expense)}</div>
    <div class="row"><span class="sub">Доходы</span><span class="amt pos">+${RUB(income)}</span></div>
    <div class="row"><span class="sub">Расходы</span><span class="amt">−${RUB(expense)}</span></div>
    ${review?`<div class="row"><span class="sub">⚠️ Требуют проверки</span><span>${review}</span></div>`:''}
  </div>
  <button class="btn" onclick="window.__go('import')">+ Импортировать выписку</button>
  <h2 class="sec">Последние операции</h2>
  ${TX.length? TX.slice().reverse().slice(0,6).map(txRow).join('') : `<div class="card empty">Пока нет операций.<br>Импортируйте выписку, чтобы начать.</div>`}
  `;
}
window.__go=t=>setTab(t);

function txRow(t){
  const neg=t.amount<0;
  return `<div class="card" style="padding:12px 16px;">
    <div class="row" style="border:none;padding:0;">
      <div><div class="tx-name">${t.merchant}</div><div class="tx-desc">${t.date} · ${t.category}</div></div>
      <div class="amt ${neg?'neg':'pos'}">${neg?'−':'+'}${RUB(Math.abs(t.amount))}</div>
    </div>
    ${t.needsReview?`<div class="review">⚠️ Требует проверки</div>`:''}
  </div>`;
}

function renderImport(){
  titleEl.textContent='Импорт выписки';
  if(!pending){
    screenEl.innerHTML=`
    <div class="stepbar"><div class="on"></div><div></div><div></div><div></div></div>
    <div class="dropzone" id="dz">
      <div style="font-size:34px;">📄</div>
      <div style="margin:8px 0 4px;font-weight:600;color:var(--text);">Перетащите выписку сюда</div>
      <div class="sub">Поддерживаются XLSX</div>
      <div style="margin-top:14px;"><button class="btn secondary" id="pickBtn" style="width:auto;padding:10px 18px;">Выбрать файл</button></div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
    </div>
    <div id="status" class="sub" style="text-align:center;margin-top:10px;"></div>`;
    const dz=document.getElementById('dz'), fi=document.getElementById('fileInput');
    document.getElementById('pickBtn').onclick=()=>fi.click();
    fi.onchange=e=>e.target.files[0]&&handleFile(e.target.files[0]);
    dz.ondragover=e=>e.preventDefault();
    dz.ondrop=e=>{e.preventDefault(); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);};
  } else {
    renderReview();
  }
}

async function handleFile(file){
  const st=document.getElementById('status'); if(st) st.textContent='Распознавание файла…';
  try{
    const txs=await parseFile(file);
    if(!txs.length) throw new Error('Операции не найдены.');
    const dup=[]; const fresh=[];
    txs.forEach(t=>{ if(FPS.has(t.fingerprint)) dup.push(t); else fresh.push(t); });
    pending={all:txs, fresh, dup};
    render();
  }catch(err){
    if(st) st.textContent='Ошибка: '+err.message;
  }
}

function renderReview(){
  const {fresh,dup}=pending;
  const income=fresh.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0);
  const expense=fresh.filter(t=>t.amount<0).reduce((a,t)=>a+Math.abs(t.amount),0);
  const recognized=fresh.filter(t=>!t.needsReview).length;
  const review=fresh.filter(t=>t.needsReview).length;
  const dates=fresh.map(t=>t.date).sort();
  screenEl.innerHTML=`
  <div class="stepbar"><div class="on"></div><div class="on"></div><div class="on"></div><div></div></div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:6px;">Выписка распознана</div>
    <div class="row"><span class="sub">Период</span><span>${dates[0]||''} — ${dates[dates.length-1]||''}</span></div>
    <div class="row"><span class="sub">Операций</span><span>${fresh.length}</span></div>
    <div class="row"><span class="sub">Поступления</span><span class="amt pos">+${RUB(income)}</span></div>
    <div class="row"><span class="sub">Расходы</span><span class="amt">−${RUB(expense)}</span></div>
    <div class="row"><span class="sub">Распознано автоматически</span><span>${recognized}</span></div>
    <div class="row"><span class="sub">Требуют проверки</span><span>${review}</span></div>
    <div class="row"><span class="sub">Дубликатов найдено</span><span>${dup.length}</span></div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button class="btn small secondary" onclick="__acceptAll()">Принять все автоматически</button>
    <button class="btn small secondary" onclick="__filterReview()">Только сомнительные</button>
  </div>
  <div id="txlist">${fresh.map((t,i)=>editRow(t,i)).join('')}</div>
  <button class="btn" style="margin-top:14px;" onclick="__commit()">Импортировать ${fresh.length} операций</button>
  <button class="btn secondary" style="margin-top:8px;" onclick="__cancelImport()">Отмена</button>
  `;
}
let filterReviewOnly=false;
window.__filterReview=()=>{filterReviewOnly=!filterReviewOnly; document.getElementById('txlist').innerHTML=pending.fresh.filter(t=>!filterReviewOnly||t.needsReview).map((t,i)=>editRow(t,pending.fresh.indexOf(t))).join('');};
window.__acceptAll=()=>{pending.fresh.forEach(t=>{if(!t.needsReview) t._accepted=true;}); render();};
window.__cancelImport=()=>{pending=null; render();};

const CATS=['Еда / Доставка','Еда / Продукты','Еда / Рестораны','Транспорт / Такси','Покупки / Маркетплейсы','Подписки','Здоровье','Дом / ЖКХ','Связь','Доход','Другое'];
const TYPES=[['income','Доход'],['expense','Расход'],['cashback','Кэшбэк'],['fee','Комиссия'],['incoming_transfer','Перевод (входящий)'],['outgoing_transfer','Перевод (исходящий)']];

function editRow(t,i){
  const neg=t.amount<0;
  return `<div class="card" style="padding:12px 16px;">
    <div class="row" style="border:none;padding:0 0 6px;">
      <div><div class="tx-name">${t.merchant}</div><div class="tx-desc">${t.date}</div></div>
      <div class="amt ${neg?'neg':'pos'}">${neg?'−':'+'}${RUB(Math.abs(t.amount))}</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <select onchange="__setCat(${i},this.value)">${CATS.map(c=>`<option ${c===t.category?'selected':''}>${c}</option>`).join('')}</select>
      <select onchange="__setType(${i},this.value)">${TYPES.map(([v,l])=>`<option value="${v}" ${v===t.type?'selected':''}>${l}</option>`).join('')}</select>
      <span class="pill" style="background:${t.needsReview?'rgba(255,149,0,.15)':'rgba(52,199,89,.15)'};color:${t.needsReview?'var(--orange)':'var(--green)'};">${Math.round(t.confidence*100)}%</span>
    </div>
    ${t.needsReview?`<div class="review">⚠️ Требует проверки${t.type.includes('transfer')?' — перевод по СБП':''}</div>`:''}
  </div>`;
}
window.__setCat=(i,v)=>{pending.fresh[i].category=v; RULES[pending.fresh[i].normalizedMerchant]=v; store.set('rules',RULES);};
window.__setType=(i,v)=>{pending.fresh[i].type=v; pending.fresh[i].needsReview=false;};

window.__commit=()=>{
  const {fresh}=pending;
  fresh.forEach(t=>{ delete t._accepted; FPS.add(t.fingerprint); TX.push(t); });
  store.set('tx',TX); store.set('fps',Array.from(FPS)); store.set('rules',RULES);
  const subs=detectSubs(fresh);
  const income=fresh.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0);
  const expense=fresh.filter(t=>t.amount<0).reduce((a,t)=>a+Math.abs(t.amount),0);
  const review=fresh.filter(t=>t.needsReview).length;
  const dupCount=pending.dup.length;
  screenEl.innerHTML=`
  <div class="stepbar"><div class="on"></div><div class="on"></div><div class="on"></div><div class="on"></div></div>
  <div class="card" style="text-align:center;">
    <div style="font-size:40px;">✅</div>
    <div style="font-weight:700;font-size:17px;margin:6px 0 12px;">Выписка успешно импортирована</div>
    <div class="row"><span class="sub">Импортировано</span><span>${fresh.length} операций</span></div>
    <div class="row"><span class="sub">Доходы</span><span class="amt pos">+${RUB(income)}</span></div>
    <div class="row"><span class="sub">Расходы</span><span class="amt">−${RUB(expense)}</span></div>
    <div class="row"><span class="sub">Найдено подписок</span><span>${subs.length}</span></div>
    <div class="row"><span class="sub">Требуют проверки</span><span>${review}</span></div>
    ${dupCount?`<div class="row"><span class="sub">Пропущено дубликатов</span><span>${dupCount}</span></div>`:''}
  </div>
  <button class="btn" onclick="pending=null; setTab('analysis');">Перейти к анализу</button>
  `;
};

function renderTx(){
  titleEl.textContent='Операции';
  screenEl.innerHTML = TX.length ? TX.slice().reverse().map(txRow).join('') : `<div class="card empty">Нет операций.</div>`;
}

function renderAnalysis(){
  titleEl.textContent='Аналитика';
  if(!TX.length){ screenEl.innerHTML=`<div class="card empty">Импортируйте выписку, чтобы увидеть аналитику.</div>`; return; }
  const expenses=TX.filter(t=>t.type==='expense');
  const byCat={}; expenses.forEach(t=>byCat[t.category]=(byCat[t.category]||0)+Math.abs(t.amount));
  const catArr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=catArr[0]?catArr[0][1]:1;
  const byM={}; expenses.forEach(t=>byM[t.merchant]=(byM[t.merchant]||0)+Math.abs(t.amount));
  const topM=Object.entries(byM).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const subs=detectSubs(TX);
  const small=expenses.filter(t=>Math.abs(t.amount)<500);
  const smallSum=small.reduce((a,t)=>a+Math.abs(t.amount),0);
  const cashback=TX.filter(t=>t.type==='cashback').reduce((a,t)=>a+t.amount,0);
  const fees=TX.filter(t=>t.type==='fee').reduce((a,t)=>a+Math.abs(t.amount),0);
  const top3=expenses.slice().sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount)).slice(0,3);
  screenEl.innerHTML=`
  <h2 class="sec">Расходы по категориям</h2>
  <div class="card">${catArr.map(([c,v])=>`<div style="margin-bottom:10px;"><div class="row" style="border:none;padding:2px 0;"><span>${c}</span><span>${RUB(v)}</span></div><div class="bar"><div style="width:${(v/maxCat*100).toFixed(0)}%"></div></div></div>`).join('')}</div>
  <h2 class="sec">Частые продавцы</h2>
  <div class="card">${topM.map(([m,v])=>`<div class="row"><span>${m}</span><span>${RUB(v)}</span></div>`).join('')}</div>
  <h2 class="sec">Подписки и регулярные платежи</h2>
  <div class="card">${subs.length?subs.map(s=>`<div class="row"><span>${s.merchant}</span><span>~${RUB(s.amount)}/мес</span></div>`).join(''):'<div class="sub">Не обнаружено</div>'}</div>
  <h2 class="sec">Сводка</h2>
  <div class="card">
    <div class="row"><span class="sub">🟡 Мелкие операции до 500 ₽</span><span>${small.length} · ${RUB(smallSum)}</span></div>
    <div class="row"><span class="sub">🟢 Кэшбэк</span><span>+${RUB(cashback)}</span></div>
    <div class="row"><span class="sub">🔴 Комиссии</span><span>−${RUB(fees)}</span></div>
  </div>
  <h2 class="sec">Крупнейшие расходы</h2>
  <div class="card">${top3.map(t=>`<div class="row"><span>${t.merchant}</span><span>−${RUB(Math.abs(t.amount))}</span></div>`).join('')}</div>
  `;
}

function renderRules(){
  titleEl.textContent='Правила категорий';
  const keys=Object.keys(RULES);
  screenEl.innerHTML=`<div class="card">${keys.length?keys.map(k=>`<div class="row"><span>${k}</span><span style="display:flex;gap:8px;align-items:center;">${RULES[k]} <button class="btn small secondary" onclick="__delRule('${k}')">✕</button></span></div>`).join(''):'<div class="sub">Правил пока нет — они появляются при исправлении категорий во время импорта.</div>'}</div>
  <button class="btn secondary" onclick="if(confirm('Очистить все данные приложения?')){localStorage.clear();TX=[];RULES={};FPS=new Set();render();}">Очистить все данные</button>`;
}
window.__delRule=k=>{delete RULES[k]; store.set('rules',RULES); render();};

render();
</script>
</body>
</html>
